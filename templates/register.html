{% extends 'base.html' %}
{% block title %}Register - AI Customer Analytics{% endblock %}
{% block auth_content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card card-saas border-0 shadow-lg p-4">
            <div class="text-center mb-4">
                <div class="display-6 text-primary mb-2"><i class="bi bi-person-plus-fill"></i></div>
                <h4 class="fw-bold mb-1">Create Account</h4>
                <p class="text-muted small">Join SegmentAI Analytics Platform</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Role</label>
                    <select name="role" class="form-select" required>
                        <option value="seller" selected>Seller / Business Manager</option>
                        <option value="admin">Data Analyst / Admin</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary-saas w-100 py-2 mb-3">Register</button>
            </form>

            <div class="text-center">
                <span class="small text-muted">Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none">Sign in here</a></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
